---
- name: Fixed-ID groups for munge and slurm (same as the head node)
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.id }}"
    system: true
  loop:
    - { name: munge, id: "{{ munge_uid }}" }
    - { name: slurm, id: "{{ slurm_uid }}" }

- name: Fixed-ID users for munge and slurm (before the packages)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.id }}"
    group: "{{ item.name }}"
    system: true
    shell: /sbin/nologin
    home: "{{ item.home }}"
    create_home: false
  loop:
    - { name: munge, id: "{{ munge_uid }}", home: /run/munge }
    - { name: slurm, id: "{{ slurm_uid }}", home: /var/lib/slurm }

- name: Copy the offline repo from the head node for the build
  ansible.builtin.copy:
    src: "{{ head_repo }}/"
    dest: /var/tmp/hpc-repo/
    mode: preserve

- name: Build-time repo (removed when the image is sealed)
  ansible.builtin.yum_repository:
    name: hpc-build
    description: HPC offline repo (build copy)
    baseurl: file:///var/tmp/hpc-repo
    gpgcheck: false
    metadata_expire: "0"

- name: Find the AlmaLinux online repo files
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: "almalinux-*.repo"
  register: online_repos

- name: Turn the online repos off (workers have no internet)
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^enabled=1'
    replace: 'enabled=0'
  loop: "{{ online_repos.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Bring the template up to the offline repo versions first (no more 9.8 vs 9.9 drift)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    disablerepo: "*"
    enablerepo: hpc-build

- name: Install slurmd, munge, PMIx, Open MPI, chrony and NFS client from the offline repo only
  ansible.builtin.dnf:
    name: [slurm, slurm-slurmd, munge, pmix, openmpi, chrony, nfs-utils]
    state: present
    disablerepo: "*"
    enablerepo: hpc-build

- name: Permanent repo for workers, read over NFS
  ansible.builtin.yum_repository:
    name: hpc-local
    description: HPC offline repo (sneakernet, over NFS)
    baseurl: file:///apps/repo
    gpgcheck: false
    metadata_expire: "0"
    skip_if_unavailable: true

- name: Slurm directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - { path: /etc/slurm, owner: root }
    - { path: /var/spool/slurmd, owner: root }
    - { path: /var/log/slurm, owner: slurm }

- name: Time from the head node only
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^(pool|server) (?!{{ network.head_ip }} )'
    state: absent
  notify: Restart chronyd

- name: Head node as the time server
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    line: "server {{ network.head_ip }} iburst"
  notify: Restart chronyd

- name: Mount points for the shared paths (no mode, so a mounted share keeps its own)
  ansible.builtin.file:
    path: "{{ item.mnt }}"
    state: directory
  loop: "{{ shared_paths }}"

- name: NFS mounts from the head node, same paths as on the head node (mounted at boot)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+:/srv/nfs/{{ item.share }}\s'
    line: "{{ network.head_ip }}:/srv/nfs/{{ item.share }} {{ item.mnt }} nfs {{ item.nfs_opts }},_netdev 0 0"
  loop: "{{ shared_paths }}"

- name: munge and slurmd installed but off until deploy pushes the key
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [munge, slurmd]

- name: Gather service facts
  ansible.builtin.service_facts:

- name: No host firewall on workers (isolated VLAN, MPI uses random ports)
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    state: stopped
  when: "'firewalld.service' in ansible_facts.services"

- name: cloud-init keeps root's key usable and sets short hostnames
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-hpc.cfg
    content: |
      disable_root: false
      prefer_fqdn_over_hostname: false
    mode: "0644"

- name: Script that re-runs DHCP once the clone has its real hostname
  ansible.builtin.copy:
    dest: /usr/local/sbin/hpc-dhcp-refresh
    mode: "0755"
    content: |
      #!/bin/bash
      # Re-run DHCP after cloud-init sets the hostname, so dnsmasq records the real name.
      DEV=$(nmcli -t -f DEVICE,TYPE device | awk -F: '$2=="ethernet"{print $1; exit}')
      CON=$(nmcli -g GENERAL.CONNECTION device show "$DEV")
      [ -n "$CON" ] && nmcli connection up "$CON"

- name: Run it after cloud-init on every boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/hpc-dhcp-refresh.service
    mode: "0644"
    content: |
      [Unit]
      Description=Re-run DHCP after cloud-init sets the hostname
      After=cloud-final.service NetworkManager.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/hpc-dhcp-refresh

      [Install]
      WantedBy=multi-user.target

- name: Enable the DHCP refresh (runs at the next boot, not now)
  ansible.builtin.systemd:
    name: hpc-dhcp-refresh.service
    enabled: true
    daemon_reload: true
