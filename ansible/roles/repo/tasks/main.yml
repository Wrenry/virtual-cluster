---
- name: Check the offline repo has been pulled onto the data disk
  ansible.builtin.stat:
    path: "{{ data_mount }}/apps/repo/repodata/repomd.xml"
  register: hpc_repo

- name: Stop if there is no offline repo
  ansible.builtin.assert:
    that: hpc_repo.stat.exists
    fail_msg: "No offline repo in {{ data_mount }}/apps/repo. Run push-kit --repo, then pull-kit."

- name: Point dnf at the offline repo
  ansible.builtin.yum_repository:
    name: hpc-local
    description: HPC offline repo (sneakernet)
    baseurl: "file://{{ data_mount }}/apps/repo"
    gpgcheck: false
    enabled: true
    priority: "10"
    metadata_expire: "0"

- name: List the enabled repos
  ansible.builtin.command: dnf -q repolist --enabled
  register: enabled_repos
  changed_when: false

- name: Turn the online repos off (offline only) or back on (fallback allowed)
  ansible.builtin.command: >-
    dnf config-manager --set-{{ 'disabled' if hpc_offline_only else 'enabled' }} {{ item }}
  loop: "{{ hpc_online_repos }}"
  when: (item in enabled_ids) == hpc_offline_only
  vars:
    enabled_ids: "{{ enabled_repos.stdout_lines | map('split') | map('first') | list }}"
