---
- name: Install dnsmasq
  ansible.builtin.dnf:
    name: dnsmasq
    state: present

- name: Let hpc.conf decide how dnsmasq binds (the stock dnsmasq.conf sets bind-interfaces)
  ansible.builtin.replace:
    path: /etc/dnsmasq.conf
    regexp: '^bind-interfaces\s*$'
    replace: '#bind-interfaces  # disabled by Ansible: hpc.conf uses bind-dynamic'
  notify: Restart dnsmasq

- name: Directory for per-node DHCP reservations
  ansible.builtin.file:
    path: /etc/dnsmasq-hosts
    state: directory
    mode: "0755"

- name: Write the dnsmasq config
  ansible.builtin.template:
    src: hpc.conf.j2
    dest: /etc/dnsmasq.d/hpc.conf
    mode: "0644"
    validate: /usr/sbin/dnsmasq --test -C %s
  notify: Restart dnsmasq

- name: dnsmasq enabled and running
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
