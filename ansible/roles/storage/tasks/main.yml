---
- name: Data disk must exist as a block device
  ansible.builtin.stat:
    path: "{{ data_disk }}"
  register: disk

- name: Refuse to continue if it is missing
  ansible.builtin.assert:
    that: disk.stat.exists and disk.stat.isblk
    fail_msg: "{{ data_disk }} not found, check lsblk"

- name: List the disk and any partitions on it
  ansible.builtin.command: lsblk -n -o NAME {{ data_disk }}
  register: parts
  changed_when: false

- name: Look for an existing filesystem
  ansible.builtin.command: blkid -o value -s TYPE {{ data_disk }}
  register: fstype
  changed_when: false
  failed_when: fstype.rc not in [0, 2]

- name: Format the disk with XFS (only if it is blank and unpartitioned)
  ansible.builtin.command: mkfs.xfs -L {{ data_label }} {{ data_disk }}
  when:
    - fstype.stdout == ""
    - parts.stdout_lines | length == 1

- name: Create the mount point
  ansible.builtin.file:
    path: "{{ data_mount }}"
    state: directory
    mode: "0755"

- name: Persist the mount in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^LABEL={{ data_label }}\s'
    line: "LABEL={{ data_label }} {{ data_mount }} xfs defaults,noatime 0 0"
  register: fstab

- name: Reload systemd so it sees the new fstab
  ansible.builtin.systemd:
    daemon_reload: true
  when: fstab.changed

- name: Mount it now
  ansible.builtin.command: mount {{ data_mount }}
  when: ansible_facts.mounts | selectattr('mount', 'equalto', data_mount) | list | length == 0

- name: Create the shared directories
  ansible.builtin.file:
    path: "{{ data_mount }}/{{ item.name }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { name: home, mode: "0755" }
    - { name: apps, mode: "0755" }
    - { name: scratch, mode: "1777" }
