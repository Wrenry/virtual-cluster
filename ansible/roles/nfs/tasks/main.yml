---
- name: Install the NFS server
  ansible.builtin.dnf:
    name: nfs-utils
    state: present

- name: Make sure the exports drop-in directory exists
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    mode: "0755"

- name: Export the shared directories to the cluster VLAN only
  ansible.builtin.copy:
    dest: /etc/exports.d/hpc.exports
    content: |
      {{ data_mount }}/home    {{ network.subnet }}(rw,sync,no_subtree_check,root_squash)
      {{ data_mount }}/apps    {{ network.subnet }}(ro,sync,no_subtree_check,root_squash)
      {{ data_mount }}/scratch {{ network.subnet }}(rw,sync,no_subtree_check,root_squash)
    mode: "0644"
  notify: Re-export

- name: NFS server enabled and running
  ansible.builtin.systemd:
    name: nfs-server
    enabled: true
    state: started

- name: Mount points for the shared paths (no mode, so a mounted share keeps its own)
  ansible.builtin.file:
    path: "{{ item.mnt }}"
    state: directory
  loop: "{{ shared_paths }}"

- name: Bind mounts in fstab, after the data disk
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+{{ item.mnt }}\s'
    line: "{{ data_mount }}/{{ item.share }} {{ item.mnt }} none bind,x-systemd.requires-mounts-for={{ data_mount }} 0 0"
  loop: "{{ shared_paths }}"
  register: bind_fstab

- name: Tell systemd about the new fstab lines
  ansible.builtin.systemd:
    daemon_reload: true
  when: bind_fstab.changed

- name: Check which shared paths are mounted
  ansible.builtin.command: findmnt -n {{ item.mnt }}
  loop: "{{ shared_paths }}"
  register: bind_state
  changed_when: false
  failed_when: false

- name: Mount the ones that are not
  ansible.builtin.command: mount {{ item.item.mnt }}
  loop: "{{ bind_state.results }}"
  loop_control:
    label: "{{ item.item.mnt }}"
  when: item.rc != 0
