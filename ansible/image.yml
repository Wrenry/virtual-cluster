---
- name: Build the golden worker image
  hosts: image
  become: true
  vars_files:
    - "{{ playbook_dir }}/../classes.yml"
  vars:
    head_repo: /srv/nfs/apps/repo
  pre_tasks:
    - name: Root SSH directory
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: "0700"

    - name: Remove cloud-init's "please login as the user" block on root's keys
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        regexp: 'Please login as the user'
        state: absent

    - name: Head node root key, for the image build and for pushing the munge key at deploy
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ lookup('ansible.builtin.file', '/root/.ssh/id_ed25519.pub') }}"
        create: true
        mode: "0600"
  roles:
    - worker
