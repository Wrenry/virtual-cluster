# Single source of truth for worker VM shapes.
# 2 GB RAM per vCPU. Every class totals 32 vCPU / 64 GB when the pool is full.
pool:
  vcpu_cap: 32
  mem_gb_cap: 64

network:
  vlan_id: 50
  subnet: 172.16.50.0/24
  head_ip: 172.16.50.10

classes:
  xs: { code: 1, vcpu: 2,  mem_gb: 4,  max_nodes: 16 }
  s:  { code: 2, vcpu: 4,  mem_gb: 8,  max_nodes: 8 }
  m:  { code: 3, vcpu: 8,  mem_gb: 16, max_nodes: 4 }
  l:  { code: 4, vcpu: 16, mem_gb: 32, max_nodes: 2 }
